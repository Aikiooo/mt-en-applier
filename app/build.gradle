plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtpatch.enapply'
    compileSdk 37

    defaultConfig {
        applicationId "com.mtpatch.enapply"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "2.5.2"
    }

    // Release signing key lives OUTSIDE the repo (never commit it). Path from the
    // Gradle property mtReleaseProps, else ~/.android/mt-en-applier-release.properties
    // (storeFile / storePassword / keyAlias / keyPassword). Without it, release
    // builds are unsigned. Every published APK must use this same key, or users
    // can't update over their installed copy.
    def releaseProps = new File(project.findProperty('mtReleaseProps') ?:
            "${System.getProperty('user.home')}/.android/mt-en-applier-release.properties")
    signingConfigs {
        if (releaseProps.exists()) {
            release {
                def p = new Properties()
                releaseProps.withInputStream { p.load(it) }
                storeFile file(p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseProps.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// All Shizuku API sources are vendored under src/main/java (rikka.shizuku.*,
// moe.shizuku.api) + src/main/aidl (moe.shizuku.server).
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    // Required so the Shizuku API's hidden-API reflection works on Android 9+.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    // LZ4 (UnityFS block de/recompression) for the on-device auto-patcher.
    implementation 'org.lz4:lz4-java:1.8.0'
}
